<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Matraka de Hierro</title>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1C1B19; color: #F2ECE0; font-family: "IBM Plex Mono", monospace; min-height: 100vh; padding: 20px 14px 40px; }
    h1 { font-family: "Oswald", sans-serif; font-weight: 700; font-size: 20px; letter-spacing: 0.06em; }
    .header { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
    .header-badge { width: 38px; height: 38px; border-radius: 8px; background: #2E2B26; border: 1px solid #7A6526; display: flex; align-items: center; justify-content: center; font-size: 18px; }
    .chip-row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 4px; }
    .chip { flex-shrink: 0; background: #252320; color: #9B948A; border: 1px solid #3A362F; border-radius: 6px; padding: 8px 12px; font-family: "Oswald", sans-serif; font-size: 12px; cursor: pointer; transition: all 0.2s; }
    .chip.active { background: #E3B23C; color: #1C1B19; border-color: #E3B23C; font-weight: 600; }
    .exercise-panel { background: #252320; border: 1px solid #3A362F; border-radius: 10px; padding: 14px; margin-bottom: 14px; }
    .carousel-wrap { display: flex; align-items: center; gap: 6px; margin-bottom: 10px; }
    .carousel-arrow { flex-shrink: 0; width: 34px; height: 34px; border-radius: 50%; background: #2E2B26; border: 1px solid #3A362F; color: #F2ECE0; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 18px; font-weight: bold; }
    .carousel-arrow:disabled { opacity: 0.5; cursor: not-allowed; }
    .carousel-track { display: flex; overflow-x: auto; gap: 0; flex: 1; border-radius: 10px; scroll-behavior: smooth; scroll-snap-type: x mandatory; }
    .carousel-track::-webkit-scrollbar { height: 4px; }
    .carousel-track::-webkit-scrollbar-thumb { background: #E3B23C; border-radius: 2px; }
    .carousel-card { position: relative; flex: 0 0 100%; scroll-snap-align: center; background: #332C1B; border: 1px solid #E3B23C; border-radius: 10px; padding: 36px 22px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 10px; min-height: 240px; cursor: pointer; transition: transform 0.2s; }
    .carousel-card:hover { transform: scale(1.02); }
    .carousel-card.add { background: #2E2B26; border: 1px dashed #3A362F; }
    .carousel-card-title { font-family: "Oswald", sans-serif; font-size: 28px; font-weight: 700; color: #F2ECE0; }
    .carousel-card-type { font-size: 13px; color: #E3B23C; text-transform: uppercase; letter-spacing: 0.06em; }
    .delete-btn { position: absolute; top: 8px; right: 8px; background: transparent; border: none; color: #9B948A; cursor: pointer; font-size: 14px; }
    .dots-row { display: flex; justify-content: center; gap: 6px; margin-top: 10px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: #3A362F; border: none; padding: 0; cursor: pointer; }
    .dot.active { background: #E3B23C; width: 18px; border-radius: 4px; }
    .log-panel { display: flex; flex-direction: column; gap: 14px; }
    .plate { background: #252320; border: 1px solid #3A362F; border-radius: 10px; padding: 16px; }
    .last-row { background: #2E2B26; border: 1px solid #3A362F; border-radius: 8px; padding: 10px 12px; margin-bottom: 14px; display: none; }
    .last-row.show { display: block; }
    .last-label { font-size: 10px; color: #9B948A; letter-spacing: 0.08em; }
    .set-rows-wrap { display: flex; flex-direction: column; gap: 10px; }
    .set-row-line { display: grid; grid-template-columns: 30px 1fr 1fr 30px; gap: 10px; align-items: center; }
    .set-row-idx { font-size: 13px; color: #9B948A; background: #2E2B26; border: 1px solid #3A362F; border-radius: 6px; padding: 10px 0; text-align: center; font-weight: 600; }
    input[type="number"] { background: #1C1B19; border: 1px solid #3A362F; border-radius: 8px; color: #F2ECE0; padding: 18px 10px; font-size: 28px; font-family: "Oswald", sans-serif; font-weight: 600; outline: none; text-align: center; width: 100%; }
    input[type="number"]:focus { border-color: #E3B23C; }
    .save-btn { background: #E3B23C; color: #1C1B19; border: none; border-radius: 8px; padding: 16px 16px; font-size: 15px; font-weight: 700; font-family: "Oswald", sans-serif; letter-spacing: 0.03em; cursor: pointer; width: 100%; margin-top: 2px; }
    .save-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .add-set-btn { display: flex; align-items: center; gap: 4px; background: transparent; color: #E3B23C; border: 1px solid #7A6526; border-radius: 6px; padding: 5px 9px; font-size: 11px; font-family: "IBM Plex Mono", monospace; cursor: pointer; }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-badge">💪</div>
    <h1>MATRAKA DE HIERRO</h1>
  </div>

  <div class="chip-row" id="groupChips"></div>

  <section class="exercise-panel">
    <div class="carousel-wrap">
      <button class="carousel-arrow" id="prevBtn">◀</button>
      <div class="carousel-track" id="carouselTrack"></div>
      <button class="carousel-arrow" id="nextBtn">▶</button>
    </div>
    <div class="dots-row" id="dotsRow"></div>
  </section>

  <section class="log-panel" id="logPanel"></section>

  <script>
    // URL del Apps Script
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyXb2MoEJH8zqsGwOQJWasJeU_LLJOH_5O3848n0_zwRRIfxbgqqZXrFuzm2cD3q0w/exec";

    // Datos de ejercicios
    const GRUPOS = [
      { id: "pecho", nombre: "Pecho", ejercicios: [
        { id: "p1", nombre: "Press de banca", tipo: "Barra fija" },
        { id: "p2", nombre: "Press inclinado", tipo: "Mancuernas" },
        { id: "p3", nombre: "Aperturas", tipo: "Mancuernas" },
        { id: "p4", nombre: "Fondos en paralelas", tipo: "Peso corporal" },
        { id: "p5", nombre: "Press en máquina", tipo: "Máquina" },
      ]},
      { id: "espalda", nombre: "Espalda", ejercicios: [
        { id: "e1", nombre: "Dominadas", tipo: "Peso corporal" },
        { id: "e2", nombre: "Remo con barra", tipo: "Barra fija" },
        { id: "e3", nombre: "Remo con mancuerna", tipo: "Mancuernas" },
        { id: "e4", nombre: "Jalón al pecho", tipo: "Máquina" },
        { id: "e5", nombre: "Peso muerto", tipo: "Barra fija" },
      ]},
      { id: "piernas", nombre: "Pierna", ejercicios: [
        { id: "pi1", nombre: "Sentadilla", tipo: "Barra fija" },
        { id: "pi2", nombre: "Prensa", tipo: "Máquina" },
        { id: "pi3", nombre: "Zancadas", tipo: "Mancuernas" },
        { id: "pi4", nombre: "Peso muerto rumano", tipo: "Barra fija" },
        { id: "pi5", nombre: "Extensión cuádriceps", tipo: "Máquina" },
      ]},
      { id: "hombros", nombre: "Hombro", ejercicios: [
        { id: "h1", nombre: "Press militar", tipo: "Barra fija" },
        { id: "h2", nombre: "Elevaciones laterales", tipo: "Mancuernas" },
        { id: "h3", nombre: "Press Arnold", tipo: "Mancuernas" },
        { id: "h4", nombre: "Pájaros", tipo: "Mancuernas" },
        { id: "h5", nombre: "Press máquina", tipo: "Máquina" },
      ]},
      { id: "brazo", nombre: "Brazo", ejercicios: [
        { id: "b1", nombre: "Curl barra", tipo: "Barra fija" },
        { id: "b2", nombre: "Curl martillo", tipo: "Mancuernas" },
        { id: "b3", nombre: "Press francés", tipo: "Barra fija" },
        { id: "b4", nombre: "Fondos en banco", tipo: "Peso corporal" },
        { id: "b5", nombre: "Extensión tríceps", tipo: "Máquina" },
      ]},
    ];

    // Estado
    let grupoActual = 0;
    let ejercicioActual = 0;
    let logs = {};
    let seriesActuales = [{ reps: "", peso: "" }];

    // Render inicial
    render();

    function render() {
      renderGrupos();
      renderCarrusel();
      renderRegistro();
    }

    function renderGrupos() {
      const container = document.getElementById("groupChips");
      container.innerHTML = "";
      GRUPOS.forEach((g, i) => {
        const btn = document.createElement("button");
        btn.className = `chip ${i === grupoActual ? "active" : ""}`;
        btn.textContent = g.nombre.toUpperCase();
        btn.onclick = () => { grupoActual = i; ejercicioActual = 0; seriesActuales = [{ reps: "", peso: "" }]; render(); };
        container.appendChild(btn);
      });
    }

    function renderCarrusel() {
      const grupo = GRUPOS[grupoActual];
      const track = document.getElementById("carouselTrack");
      const dotsRow = document.getElementById("dotsRow");

      track.innerHTML = "";
      dotsRow.innerHTML = "";

      // Tarjetas de ejercicios
      grupo.ejercicios.forEach((ex, i) => {
        const card = document.createElement("div");
        card.className = "carousel-card";
        card.innerHTML = `<button class="delete-btn" style="display:none;">✕</button><div class="carousel-card-title">${ex.nombre}</div><div class="carousel-card-type">${ex.tipo}</div>`;
        card.onclick = () => { ejercicioActual = i; render(); };
        track.appendChild(card);
      });

      // Tarjeta de añadir
      const addCard = document.createElement("div");
      addCard.className = "carousel-card add";
      addCard.innerHTML = `<div style="font-size:26px;">+</div><div>Añadir ejercicio</div>`;
      track.appendChild(addCard);

      // Dots
      for (let i = 0; i <= grupo.ejercicios.length; i++) {
        const dot = document.createElement("button");
        dot.className = `dot ${i === ejercicioActual ? "active" : ""}`;
        dot.onclick = () => { ejercicioActual = i; render(); };
        dotsRow.appendChild(dot);
      }

      // Scroll
      setTimeout(() => {
        const cards = track.querySelectorAll(".carousel-card");
        if (cards[ejercicioActual]) {
          cards[ejercicioActual].scrollIntoView({ behavior: "smooth", inline: "center" });
        }
      }, 50);

      // Botones
      document.getElementById("prevBtn").disabled = ejercicioActual <= 0;
      document.getElementById("nextBtn").disabled = ejercicioActual >= grupo.ejercicios.length;
      document.getElementById("prevBtn").onclick = () => { if (ejercicioActual > 0) { ejercicioActual--; render(); } };
      document.getElementById("nextBtn").onclick = () => { if (ejercicioActual < grupo.ejercicios.length) { ejercicioActual++; render(); } };
    }

    function renderRegistro() {
      const panel = document.getElementById("logPanel");
      const grupo = GRUPOS[grupoActual];
      
      if (ejercicioActual >= grupo.ejercicios.length) {
        panel.innerHTML = "<div style='background: #252320; border: 1px solid #3A362F; border-radius: 10px; padding: 26px; text-align: center; color: #9B948A;'>Selecciona un ejercicio.</div>";
        return;
      }

      const ex = grupo.ejercicios[ejercicioActual];
      const exLogs = logs[ex.id] || [];
      const lastLog = exLogs.length ? exLogs[exLogs.length - 1] : null;

      let html = `<div class="plate">
        <div style="margin-bottom: 12px;">
          <div style="font-family: Oswald; font-size: 17px; font-weight: 600;">${ex.nombre}</div>
          <div style="font-size: 11px; color: #E3B23C; text-transform: uppercase; letter-spacing: 0.05em;">${ex.tipo}</div>
        </div>`;

      if (lastLog) {
        html += `<div class="last-row show">
          <div class="last-label">ÚLTIMO REGISTRO</div>
          <div style="margin-top: 6px; font-size: 10px; color: #9B948A;">hace poco</div>
          <div style="display: flex; gap: 12px; margin-top: 4px;">`;
        lastLog.series.forEach((s, i) => {
          html += `<div><span style="font-family: Oswald; font-size: 16px; color: #E3B23C;">${s.reps}</span><span style="font-size: 10px; color: #9B948A;"> reps</span> ${s.peso > 0 ? `<span style="color: #E3B23C;">× ${s.peso}kg</span>` : ""}</div>`;
        });
        html += `</div></div>`;
      }

      html += `<div class="set-rows-wrap">`;
      seriesActuales.forEach((s, i) => {
        html += `<div class="set-row-line">
          <div class="set-row-idx">S${i+1}</div>
          <input type="number" placeholder="reps" value="${s.reps}" onchange="seriesActuales[${i}].reps = this.value;" />
          <input type="number" placeholder="kg" value="${s.peso}" step="0.5" onchange="seriesActuales[${i}].peso = this.value;" />
          <button style="background: transparent; border: none; color: #9B948A; cursor: pointer;" ${seriesActuales.length === 1 ? "disabled" : ""} onclick="seriesActuales.splice(${i}, 1); renderRegistro();">✕</button>
        </div>`;
      });
      html += `</div>
        <button class="add-set-btn" onclick="seriesActuales.push({ reps: '', peso: '' }); renderRegistro();">+ Añadir serie</button>
        <button class="save-btn" onclick="guardar();">Registrar sesión</button>
      </div>`;

      panel.innerHTML = html;
    }

    async function guardar() {
      const grupo = GRUPOS[grupoActual];
      const ex = grupo.ejercicios[ejercicioActual];
      const series = seriesActuales.filter(s => s.reps > 0).map(s => ({ reps: parseInt(s.reps), peso: parseFloat(s.peso) || 0 }));

      if (!series.length) return;

      if (!logs[ex.id]) logs[ex.id] = [];
      logs[ex.id].push({ series, fecha: new Date().toISOString() });

      // Guardar en Sheets
      for (let i = 0; i < series.length; i++) {
        await fetch(APPS_SCRIPT_URL, {
          method: "POST",
          body: JSON.stringify({
            action: "saveSet",
            date: new Date().toISOString(),
            grupo: grupo.nombre,
            ejercicio: ex.nombre,
            numeroSerie: i + 1,
            reps: series[i].reps,
            peso: series[i].peso,
          }),
        });
      }

      seriesActuales = [{ reps: "", peso: "" }];
      renderRegistro();
    }
  </script>
</body>
</html>
